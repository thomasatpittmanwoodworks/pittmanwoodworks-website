# Website editor for pittmanwoodworks.com (Decap CMS)
# Sign in at /admin with a GitHub account that has access to this repository.
backend:
  name: github
  repo: thomasatpittmanwoodworks/pittmanwoodworks-website
  branch: main
  # Sign-in always goes through the site's Netlify address, whatever domain the admin is opened on
  site_domain: pittmanwoodworkscom.netlify.app
  commit_messages:
    update: "Update {{collection}}: {{slug}} (website admin)"
    uploadMedia: "Upload {{path}} (website admin)"

site_url: https://www.pittmanwoodworks.com
display_url: https://www.pittmanwoodworks.com
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: Site settings
    description: Logo, contact details and other information used across every page.
    files:
      - name: site
        label: Company info & branding
        file: data/site.json
        fields:
          - {label: Logo, name: logo, widget: image, required: false, hint: "Wide logo (SVG or transparent PNG). Replaces the PW mark in the header. Leave blank to keep the text mark."}
          - {label: Browser icon (favicon), name: favicon, widget: image, required: false, hint: "Square PNG, at least 512 x 512."}
          - {label: Phone, name: phone, widget: string}
          - {label: Email, name: email, widget: string}
          - {label: Address line 1, name: address1, widget: string}
          - {label: Address line 2, name: address2, widget: string}
          - {label: Business hours, name: hours, widget: string, required: false, hint: "e.g. Mon–Fri 7:00 am – 4:30 pm"}
          - {label: Credentials (footer), name: credentials, widget: list, field: {label: Line, name: line, widget: string}}
          - {label: Notice bar, name: notice, widget: string, required: false, hint: "Optional line shown under the menu on every page, e.g. Now scheduling installs for March 2027. Leave blank to hide."}
          - {label: LinkedIn URL, name: linkedin, widget: string, required: false}
          - {label: Facebook URL, name: facebook, widget: string, required: false}
          - {label: Instagram URL, name: instagram, widget: string, required: false}

  - name: blog
    label: Blog
    label_singular: Blog post
    description: Weekly posts. Posts publish on their date; turn on Draft to keep one hidden.
    folder: content/blog
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Publish date, name: date, widget: datetime, date_format: "MMM D, YYYY", time_format: false, format: "YYYY-MM-DD", hint: "Set a future date to schedule a post. It goes live on the first site update on or after that date."}
      - {label: Draft (hidden from the site), name: draft, widget: boolean, default: false}
      - label: Category
        name: category
        widget: select
        default: guide
        options:
          - {label: Project spotlight, value: spotlight}
          - {label: Guides, value: guide}
          - {label: Company news, value: news}
          - {label: Industry insights, value: industry}
      - {label: Author, name: author, widget: string, default: Pittman Woodworks}
      - {label: Cover photo, name: image, widget: image, required: false, hint: "Wide photo, at least 1600 px across."}
      - {label: Cover photo description, name: imageAlt, widget: string, required: false, hint: "Describe the photo for screen readers and Google."}
      - {label: Summary, name: summary, widget: text, hint: "One or two sentences. Shown on the blog page and in Google results."}
      - {label: Article, name: body, widget: markdown}

  - name: pages
    label: Page text
    description: Headlines and copy on the main pages.
    files:
      - name: home
        label: Homepage
        file: data/home.json
        fields:
          - {label: Small line above headline, name: eyebrow, widget: string}
          - {label: Headline, name: title, widget: string}
          - {label: Headline highlight (shown in blue), name: highlight, widget: string, required: false}
          - {label: Intro paragraph, name: intro, widget: text}
          - {label: Badges under buttons, name: badges, widget: list, field: {label: Badge, name: badge, widget: string}}
          - label: Capabilities (bottom of hero)
            name: capabilities
            widget: list
            summary: "{{fields.title}}"
            fields: [{label: Title, name: title, widget: string}, {label: Text, name: text, widget: text}]
          - {label: Industries heading, name: industriesTitle, widget: string}
          - {label: Industries intro, name: industriesIntro, widget: text}
          - {label: Process heading, name: processTitle, widget: string}
          - {label: Process intro, name: processIntro, widget: string}
          - label: Process steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields: [{label: Step, name: title, widget: string}, {label: Description, name: text, widget: text}, {label: Owner, name: owner, widget: string}]
          - {label: Bottom banner heading, name: ctaTitle, widget: string}
          - {label: Bottom banner text, name: ctaText, widget: text}
      - name: about
        label: About page
        file: data/about.json
        fields:
          - {label: Headline start, name: title, widget: string}
          - {label: Headline highlight (shown in blue), name: highlight, widget: string, required: false}
          - {label: Headline end, name: titleEnd, widget: string, required: false}
          - {label: Intro paragraph, name: intro, widget: text}
          - label: Highlights (under intro)
            name: highlights
            widget: list
            summary: "{{fields.title}}"
            fields: [{label: Title, name: title, widget: string}, {label: Text, name: text, widget: text}]
          - {label: Story heading, name: storyTitle, widget: string}
          - {label: Story paragraphs, name: story, widget: list, field: {label: Paragraph, name: paragraph, widget: text}}
          - label: Values
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields: [{label: Value, name: title, widget: string}, {label: Description, name: text, widget: text}]
          - {label: Team section heading, name: teamTitle, widget: string}
          - {label: Hiring banner heading, name: joinTitle, widget: string}
          - {label: Hiring banner text, name: joinText, widget: text}
      - name: careers
        label: Careers page
        file: data/careers.json
        fields:
          - {label: Headline, name: title, widget: string}
          - {label: Intro paragraph, name: intro, widget: text}
          - {label: Why-work-here heading, name: whyTitle, widget: string}
          - label: Reasons to work here
            name: why
            widget: list
            summary: "{{fields.title}}"
            fields: [{label: Title, name: title, widget: string}, {label: Text, name: text, widget: text}]
          - {label: Open roles heading, name: openingsTitle, widget: string}
          - {label: Open roles intro, name: openingsIntro, widget: text}

  - name: industries
    label: Industries
    description: The six industry pages and the industry cards on the homepage.
    files:
      - name: industries
        label: Industry pages
        file: data/industries.json
        fields:
          - label: Industries
            name: industries
            widget: list
            allow_add: false
            summary: "{{fields.name}}"
            fields:
              - {label: Page address, name: slug, widget: hidden}
              - {label: Short name (cards and breadcrumb), name: name, widget: string}
              - {label: Who it's for (small line), name: audience, widget: string}
              - {label: Page headline, name: title, widget: string}
              - {label: Summary, name: summary, widget: text}
              - {label: What we build heading, name: heading, widget: string}
              - {label: What we build, name: builds, widget: list, field: {label: Item, name: item, widget: string}}
              - label: Typical specifications
                name: specs
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                fields: [{label: Label, name: label, widget: string}, {label: Value, name: value, widget: string}]

  - name: projects
    label: Projects
    description: Job photos. Projects with photos appear on the homepage (if featured) and on their industry page.
    files:
      - name: projects
        label: Project gallery
        file: data/projects.json
        fields:
          - label: Projects
            name: projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}} · {{fields.industry}}"
            fields:
              - {label: Project name, name: title, widget: string, hint: "e.g. Eastside Clinic nurse station"}
              - label: Industry
                name: industry
                widget: select
                options:
                  - {label: Healthcare, value: healthcare}
                  - {label: Education, value: education}
                  - {label: Restaurants, value: restaurants}
                  - {label: Offices, value: offices}
                  - {label: Multifamily, value: multifamily}
                  - {label: Retail & automotive, value: retail-automotive}
              - {label: Feature on homepage, name: featured, widget: boolean, default: false}
              - {label: Photos, name: photos, widget: list, field: {label: Photo, name: photo, widget: image}, hint: "First photo is the cover."}
              - {label: Location, name: location, widget: string, required: false, hint: "e.g. Fort Worth, TX"}
              - {label: Client or general contractor, name: client, widget: string, required: false}
              - {label: Year, name: year, widget: string, required: false}
              - {label: Scope, name: scope, widget: string, required: false, hint: "e.g. 84 LF casework, solid surface tops"}

  - name: faq
    label: FAQ
    description: Questions shown on the Bidding page.
    files:
      - name: faq
        label: Frequently asked questions
        file: data/faq.json
        fields:
          - label: Questions
            name: questions
            label_singular: Question
            widget: list
            summary: "{{fields.q}}"
            fields:
              - {label: Question, name: q, widget: string}
              - {label: Answer, name: a, widget: text}

  - name: team
    label: Team
    description: People shown on the About page.
    files:
      - name: team
        label: Team members
        file: data/team.json
        fields:
          - label: People
            name: people
            label_singular: Person
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Title, name: role, widget: string}
              - label: Team
                name: department
                widget: select
                default: Shop
                options:
                  - {label: Leadership, value: Leadership}
                  - {label: Estimating & project management, value: Office}
                  - {label: Production, value: Shop}
                  - {label: Installation, value: Field}
              - {label: Photo, name: photo, widget: image, required: false, hint: "Vertical photo, chest up, plain background."}
              - {label: Email, name: email, widget: string, required: false}
              - {label: Phone, name: phone, widget: string, required: false}
              - {label: With us since, name: since, widget: string, required: false, hint: "Year, e.g. 2021"}
              - {label: Focus, name: focus, widget: string, required: false, hint: "One line on what they mostly do"}
              - {label: Bio, name: bio, widget: text, required: false, hint: "2-3 sentences"}
              - {label: Quote, name: quote, widget: string, required: false}

  - name: jobs
    label: Job listings
    description: Roles shown on the Careers page.
    files:
      - name: jobs
        label: Open roles
        file: data/jobs.json
        fields:
          - label: Jobs
            name: jobs
            label_singular: Job
            widget: list
            summary: "{{fields.title}} · {{fields.team}}"
            fields:
              - {label: Job title, name: title, widget: string}
              - {label: Show on website, name: open, widget: boolean, default: true, hint: "Turn off to hide this role without deleting it"}
              - {label: Team, name: team, widget: select, options: [Shop, Field, Office], default: Shop}
              - {label: Type, name: type, widget: select, options: [Full-time, Part-time, Contract, Seasonal], default: Full-time}
              - {label: Location, name: location, widget: string, default: North Richland Hills shop}
              - {label: Pay (optional), name: pay, widget: string, required: false, hint: "e.g. $18–$24/hr, based on experience"}
              - {label: Summary, name: summary, widget: text}
              - {label: What you'll do, name: duties, widget: list, field: {label: Duty, name: duty, widget: string}}
              - {label: What you bring, name: requirements, widget: list, field: {label: Requirement, name: requirement, widget: string}}

  - name: clients
    label: Trusted by
    description: Client names and logos in the homepage banner. Only add logos you have permission to use.
    files:
      - name: clients
        label: Clients
        file: data/clients.json
        fields:
          - label: Clients
            name: clients
            label_singular: Client
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Logo (optional), name: logo, widget: image, required: false, hint: "SVG or transparent PNG. The name shows until a logo is added."}
