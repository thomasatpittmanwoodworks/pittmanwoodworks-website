# Netlify settings for pittmanwoodworks.com
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Old Wix blog posts went to /post/...
[[redirects]]
  from = "/post/*"
  to = "/blog/"
  status = 301

# Old Wix page addresses (301 = permanent, keeps Google ranking)
[[redirects]]
  from = "/our-company"
  to = "/about"
  status = 301
[[redirects]]
  from = "/our-services"
  to = "/industries/"
  status = 301
[[redirects]]
  from = "/commercial-cabinets"
  to = "/industries/"
  status = 301
[[redirects]]
  from = "/residential-cabinets"
  to = "/industries/multifamily"
  status = 301
[[redirects]]
  from = "/contractors"
  to = "/bidding"
  status = 301
[[redirects]]
  from = "/schedule-consultation"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/blank"
  to = "/industries/"
  status = 301

# Keep the admin out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
