# Netlify settings for pittmanwoodworks.com
[build]
  publish = "."

# Old Wix page addresses (301 = permanent, keeps Google ranking)
[[redirects]]
  from = "/our-company"
  to = "/about"
  status = 301
[[redirects]]
  from = "/our-services"
  to = "/industries/"
  status = 301
[[redirects]]
  from = "/commercial-cabinets"
  to = "/industries/"
  status = 301
[[redirects]]
  from = "/residential-cabinets"
  to = "/industries/multifamily"
  status = 301
[[redirects]]
  from = "/contractors"
  to = "/bidding"
  status = 301
[[redirects]]
  from = "/schedule-consultation"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/blank"
  to = "/industries/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
